name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example, v0.3.8)"
        required: true
        type: string

# デフォルト権限を最小化
permissions:
  contents: read

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Releasesの作成に必要

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}

      # actions/setup-node v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version from tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Sync extension version with release tag
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Test
        run: npm test

      - name: Package extension
        run: |
          npm install -g @vscode/vsce
          vsce package --out vscode-undotree-${{ env.RELEASE_VERSION }}.vsix

      # softprops/action-gh-release v2
      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body: |
            ## vscode-undotree ${{ inputs.tag }}

            ### インストール方法
            1. `.vsix` ファイルをダウンロード
            2. VS Code でコマンドパレット → `Extensions: Install from VSIX...`
            3. ダウンロードした `.vsix` を選択
          files: vscode-undotree-${{ env.RELEASE_VERSION }}.vsix
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
